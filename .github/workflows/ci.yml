name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: python -m pip install conan==2.33.0

      - name: Detect compiler profile
        run: conan profile detect --force

      - name: Install C++ dependencies
        run: >-
          conan install . --output-folder=build --build=missing
          -s build_type=Release -s compiler.cppstd=20
          -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/libcompressor"

      - name: Smoke test installed compressor
        run: |
          "$RUNNER_TEMP/libcompressor/bin/compressor" zlib test_string
          "$RUNNER_TEMP/libcompressor/bin/compressor" bzip test_string
